# ElCaciqueDeck - Paperless-ngx (document vault)
# Start:  cd ~/elcaciquedeck/paperless && docker compose up -d
# Stop:   cd ~/elcaciquedeck/paperless && docker compose down
# Open:   http://<laptop number>:8000
#
# All documents are stored on the Library drive in Vault/paperless.
# Nothing here starts by itself at boot (restart: "no").

services:
  broker:
    image: docker.io/library/redis:7
    restart: "no"
    volumes:
      - redisdata:/data

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: "no"
    depends_on:
      - broker
    ports:
      - "8000:8000"
    volumes:
      # PAPERLESS_DIR is set in .env by tools/move-to-vault.sh (Vault drive).
      # Until the move, the old location on the Library drive is used.
      - ${PAPERLESS_DIR:-/media/${USER}/Library/Vault/paperless}/data:/usr/src/paperless/data
      - ${PAPERLESS_DIR:-/media/${USER}/Library/Vault/paperless}/media:/usr/src/paperless/media
      - ${PAPERLESS_DIR:-/media/${USER}/Library/Vault/paperless}/export:/usr/src/paperless/export
      - ${PAPERLESS_DIR:-/media/${USER}/Library/Vault/paperless}/consume:/usr/src/paperless/consume
    env_file:
      - .env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_TIME_ZONE: America/Puerto_Rico
      PAPERLESS_OCR_LANGUAGE: spa+eng
      PAPERLESS_CSRF_TRUSTED_ORIGINS: http://caciquedocs.home
      USERMAP_UID: 1000
      USERMAP_GID: 1000

volumes:
  redisdata:
