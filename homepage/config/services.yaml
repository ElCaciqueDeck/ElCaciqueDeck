# Cacique - the buttons on the front page
# {{HOMEPAGE_VAR_IP}} is replaced with the laptop number (from .env).
# Icons are saved on the laptop by the setup script (works offline).
# siteMonitor checks the server on this same laptop and shows a green dot when it's up.
# "# needs: <file>" = only show this button when that file exists (the app was installed).
#   setup-homepage.sh writes the live copy (config-live/) without the buttons whose app isn't installed.

- Familia · Family:
    - CaciqueFlix:
        icon: /icons/jellyfin.png
        href: http://{{HOMEPAGE_VAR_IP}}:8096
        description: Películas, series y anime · Movies & shows
        siteMonitor: http://127.0.0.1:8096

    - CaciquePhotos:
        # needs: immich/.env
        icon: /icons/immich.png
        href: http://{{HOMEPAGE_VAR_IP}}:2283
        description: Fotos y videos de la familia · Family photos
        siteMonitor: http://127.0.0.1:2283

