# Cacique - the top bar
- greeting:
    text_size: xl
    text: ¡Bienvenidos a casa! · Welcome home

- datetime:
    locale: es
    text_size: md
    format:
      dateStyle: long
      timeStyle: short
      hour12: true

- resources:
